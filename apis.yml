aid: minubo
name: Minubo
description: >-
  Minubo is a German business-intelligence platform for e-commerce and retail that
  integrates, models, and contextualizes commerce data — orders, products, customers,
  and suppliers — into AI Insights, Profit Management, reporting, and a supplier portal.
  Minubo also exposes a public REST API (Auth, ETL, and Data services) so tenants can
  authenticate with a JWT, trigger and monitor data loads, discover their queryable
  schema, and run queries against their modeled commerce data, plus connectors to tools
  like Power BI, Superset, n8n, and LLMs.
